<div class="container">
  <h1>Каталог фільмів</h1>

  <div class="movie-list">
    @for (movie of movies(); track movie.id) {
      <div class="movie-card">
        <h3>{{ movie.title }}</h3>
        <p>Рік: {{ movie.year }}</p>
        <p>Рейтинг: {{ movie.rating }}</p>
        <button (click)="onRemoveMovie(movie.id)">Видалити</button>
      </div>
    }
  </div>

  <h2>Додати фільм</h2>
  <form (ngSubmit)="onAddMovie()">
    <input
      type="text"
      name="title2"
      placeholder="Назва"
      [(ngModel)]="title2"
      required
    />
    <input
      type="number"
      name="year"
      placeholder="Рік"
      [(ngModel)]="year"
      required
    />
    <input
      type="number"
      name="rating"
      placeholder="Рейтинг"
      [(ngModel)]="rating"
      required
    />
    <button type="submit">Додати фільм</button>
  </form>
</div>

<router-outlet />
